<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | Orbit Market</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.background{
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle at top,#222 0%,#000 70%);
z-index:-2;
}

.container{

width:420px;

padding:35px;

background:#111;

border:1px solid gold;

border-radius:20px;

box-shadow:0 0 30px rgba(255,215,0,.25);

text-align:center;

}

.logo{

font-size:60px;

margin-bottom:15px;

}

h1{

color:gold;

margin-bottom:15px;

}

p{

color:#bbb;

margin-bottom:25px;

font-size:15px;

line-height:24px;

}

input{

width:100%;

padding:16px;

background:#222;

border:none;

border-radius:10px;

color:white;

font-size:16px;

margin-bottom:20px;

}

input:focus{

outline:none;

box-shadow:0 0 15px gold;

}

button{

width:100%;

padding:16px;

background:red;

border:none;

border-radius:10px;

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

transition:.3s;

}

button:hover{

transform:scale(1.03);

box-shadow:0 0 20px red;

}

.back{

margin-top:25px;

}

.back a{

color:gold;

text-decoration:none;

}

</style>

</head>

<body>

<div class="background"></div>

<div class="container">

<div class="logo">🌍</div>

<h1>Forgot Password</h1>

<p>

Enter the email address associated with your Orbit Market account and we'll send you a password reset link.

</p>

<form>

<input
type="email"
placeholder="Email Address"
required>

<button type="submit">

SEND RESET PASSWORD 

</button>

</form>

<div class="back">

<a href="login.html">

← Back to Login

</a>

</div>

</div>

</body>

</html>
