<!DOCTYPE html>
<html>

<head>

<title>Orbit Market Login</title>


<style>

body{
background:#000;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}


.box{

background:#111;
padding:30px;
border-radius:20px;
width:350px;
border:1px solid gold;

}


h1{

color:gold;
text-align:center;

}


input{

width:100%;
padding:15px;
margin:10px 0;
background:#000;
border:1px solid #333;
color:white;
border-radius:10px;

}


button{

width:100%;
padding:15px;
background:gold;
border:none;
border-radius:10px;
font-weight:bold;

}


a{

color:gold;

}

</style>

</head>


<body>


<div class="box">


<h1>🌍 Orbit Market</h1>


<form id="loginForm">


<input id="email"
type="email"
placeholder="Email"
required>


<input id="password"
type="password"
placeholder="Password"
required>



<button>
Login
</button>


</form>


<p>
<a href="forgot-password.html">
Forgot Password?
</a>
</p>


<p>
Don't have account?
<a href="register.html">
Register
</a>
</p>


</div>



<script>


document.getElementById("loginForm")
.onsubmit=async(e)=>{


e.preventDefault();



let email=
document.getElementById("email").value;


let password=
document.getElementById("password").value;



let res=await fetch(

"http://localhost:5000/api/auth/login",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email,
password

})

});


let data=await res.json();



if(res.ok){

localStorage.setItem(
"token",
data.token
);


window.location.href=
"dashboard.html";


}

else{

alert(data.message);

}


}



</script>


</body>

</html>
