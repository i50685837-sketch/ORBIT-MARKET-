<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Orbit Market Login</title>


<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}


body{

background:#000;

color:white;

height:100vh;

display:flex;

align-items:center;

justify-content:center;

}



.login-box{

width:90%;

max-width:420px;

background:#111;

padding:35px;

border-radius:20px;

border:1px solid gold;

}



.logo{

text-align:center;

color:gold;

font-size:30px;

font-weight:bold;

margin-bottom:20px;

}



h2{

text-align:center;

margin-bottom:25px;

}



.social{

display:flex;

gap:15px;

margin-bottom:20px;

}



.social button{

flex:1;

padding:14px;

background:#000;

color:white;

border:1px solid #444;

border-radius:10px;

display:flex;

align-items:center;

justify-content:center;

gap:8px;

cursor:pointer;

}



.social img{

width:22px;

height:22px;

}



input{

width:100%;

padding:15px;

margin:10px 0;

background:#000;

color:white;

border:1px solid #333;

border-radius:10px;

}



.login-btn{

width:100%;

padding:15px;

background:red;

color:white;

border:none;

border-radius:10px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}



.links{

text-align:center;

margin-top:20px;

}



.links a{

color:gold;

text-decoration:none;

}



</style>

</head>


<body>


<div class="login-box">


<div class="logo">

🌍 Orbit Market

</div>



<h2>Login</h2>



<div class="social">


<button onclick="googleLogin()">

<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">

Google

</button>



<button onclick="appleLogin()">

<img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg">

Apple

</button>


</div>




<form id="loginForm">


<input

type="email"

id="email"

placeholder="Email Address"

required>



<input

type="password"

id="password"

placeholder="Password"

required>



<button class="login-btn">

LOGIN

</button>


</form>



<div class="links">


<p>

<a href="forgot-password.html">

Forgot Password?

</a>

</p>


<p>

Don't have an account?

<a href="register.html">

Create Account

</a>

</p>


</div>


</div>



<script>


function googleLogin(){

window.location.href=

"http://localhost:5000/auth/google";

}



function appleLogin(){

alert("Apple login will be connected");

}




document.getElementById("loginForm")
.onsubmit = async function(e){


e.preventDefault();



let email =
document.getElementById("email").value;


let password =
document.getElementById("password").value;



let response = await fetch(

"http://localhost:5000/api/auth/login",

{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

email,

password

})

}

);



let data = await response.json();



if(response.ok){


localStorage.setItem(
"token",
data.token
);


window.location.href="dashboard.html";


}

else{


alert(data.message || "Login failed");


}


};



</script>


</body>

</html>
