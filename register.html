<!DOCTYPE html>
<html>

<head>

<title>Orbit Market Register</title>

<style>

body{
background:#000;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
background:#111;
padding:30px;
border-radius:20px;
width:350px;
border:1px solid gold;
}

h1{
color:gold;
text-align:center;
}

input{
width:100%;
padding:15px;
margin:10px 0;
background:#000;
color:white;
border:1px solid #333;
border-radius:10px;
}

button{
width:100%;
padding:15px;
background:red;
color:white;
border:none;
border-radius:10px;
font-weight:bold;
}

a{
color:gold;
}

</style>

</head>


<body>


<div class="box">

<h1>🌍 Orbit Market</h1>

<h2>Create Account</h2>


<form id="registerForm">


<input id="email"
type="email"
placeholder="Email"
required>


<input id="password"
type="password"
placeholder="Password"
required>


<button>
Register
</button>


</form>


<p>
Already have account?
<a href="login.html">
Login
</a>
</p>


</div>



<script>

document.getElementById("registerForm")
.onsubmit=async(e)=>{

e.preventDefault();


let email=
document.getElementById("email").value;


let password=
document.getElementById("password").value;



let res=await fetch(

"http://localhost:5000/api/auth/register",

{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email,
password

})

});


let data=await res.json();


alert(data.message);


if(res.ok){

window.location.href="login.html";

}


}


</script>


</body>

</html>
