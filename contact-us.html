<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact Us - Orbit Market</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:#000;

color:white;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

}


.contact-container{

width:90%;

max-width:500px;

background:#111;

padding:35px;

border-radius:20px;

border:1px solid gold;

}


h1{

text-align:center;

color:gold;

margin-bottom:25px;

}


.contact-box{

background:#1a1a1a;

padding:20px;

border-radius:15px;

margin-bottom:20px;

}


.contact-box h3{

color:gold;

margin-bottom:10px;

}


.contact-box p{

color:#ccc;

}


form input,
form textarea{

width:100%;

padding:15px;

margin:10px 0;

background:#000;

border:1px solid #333;

border-radius:10px;

color:white;

}


textarea{

height:120px;

resize:none;

}


button{

width:100%;

padding:15px;

background:red;

color:white;

border:none;

border-radius:10px;

font-size:17px;

font-weight:bold;

cursor:pointer;

}


button:hover{

background:darkred;

}


.back{

display:block;

text-align:center;

margin-top:20px;

color:gold;

text-decoration:none;

}


</style>

</head>


<body>


<div class="contact-container">


<h1>📞 Contact Orbit Market</h1>


<div class="contact-box">

<h3>Customer Support</h3>

<p>
Our team is ready to assist you with account, investment and trading questions.
</p>

</div>


<div class="contact-box">

<h3>Contact Information</h3>

<p>📧 Email: support@orbitmarket.com</p>

<p>📱 WhatsApp: +254 731070008</p>

<p>🌍 Location: Kenya</p>

</div>


<form>

<input type="text" placeholder="Your Name">

<input type="email" placeholder="Your Email">

<input type="text" placeholder="Subject">

<textarea placeholder="Write your message"></textarea>


<button type="submit">

Send Message

</button>

</form>


<a class="back" href="dashboard.html">

← Back to Dashboard

</a>


</div>


</body>

</html>
